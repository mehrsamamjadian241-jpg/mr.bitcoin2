<script>
/* =========================
   Mr. Bitcoin - LIVE DATA
   ========================= */

const API = {
    TGJU_API_GO: 'https://tgju-api-go.vercel.app/api/price',
    COINGECKO: 'https://api.coingecko.com/api/v3'
};

const CONFIG = {
    UPDATE_INTERVAL: 60 * 1000,

    // فقط در صورتی استفاده می‌شود که API زنده در دسترس نباشد
    DEFAULT_DOLLAR_TOMAN: 223000,

    // جلوگیری از قبول قیمت‌های اشتباه مثل 83000
    MIN_REASONABLE_DOLLAR_TOMAN: 150000,

    MAX_REASONABLE_DOLLAR_TOMAN: 500000
};

let cryptoData = [];
let tgjuData = {
    dollar: null
};


/* =========================
   NUMBER HELPERS
   ========================= */

function normalizeDigits(value) {
    return String(value ?? '')
        .replace(/[۰-۹]/g, d =>
            '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)
        )
        .replace(/[٠-٩]/g, d =>
            '٠١٢٣٤٥٦٧٨٩'.indexOf(d)
        );
}

function parseNumber(value) {
    if (typeof value === 'number' && Number.isFinite(value)) {
        return value;
    }

    let text = normalizeDigits(value)
        .replace(/[٬,\s]/g, '')
        .replace(/٫/g, '.');

    const number = Number(text);

    return Number.isFinite(number) ? number : null;
}


/* =========================
   DOLLAR VALIDATION
   ========================= */

function normalizeDollarToRial(rawValue) {

    const number = parseNumber(rawValue);

    if (!number) {
        return null;
    }

    // اگر مقدار ریال باشد
    if (
        number >= CONFIG.MIN_REASONABLE_DOLLAR_TOMAN * 10 &&
        number <= CONFIG.MAX_REASONABLE_DOLLAR_TOMAN * 10
    ) {
        return number;
    }

    // اگر مقدار تومان باشد
    if (
        number >= CONFIG.MIN_REASONABLE_DOLLAR_TOMAN &&
        number <= CONFIG.MAX_REASONABLE_DOLLAR_TOMAN
    ) {
        return number * 10;
    }

    return null;
}


/* =========================
   FALLBACK
   ========================= */

function createFallbackDollar() {

    const rial =
        CONFIG.DEFAULT_DOLLAR_TOMAN * 10;

    return {
        price_rial: rial,
        price_toman: CONFIG.DEFAULT_DOLLAR_TOMAN,
        change: 0,
        low: rial,
        high: rial,
        time: formatTime(new Date()),
        source: 'fallback'
    };
}


/* =========================
   FORMAT TIME
   ========================= */

function formatTime(date) {

    return date.toLocaleTimeString('fa-IR', {
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
    });
}


/* =========================
   GET CURRENT DOLLAR
   ========================= */

async function fetchTgjuDollar() {

    const endpoints = [
        API.TGJU_API_GO + '/currency',
        API.TGJU_API_GO
    ];

    for (const endpoint of endpoints) {

        try {

            const response = await fetch(endpoint, {
                method: 'GET',
                cache: 'no-store',
                signal: AbortSignal.timeout(10000)
            });

            if (!response.ok) {
                continue;
            }

            const data = await response.json();

            /*
             * حالت معمول API:
             * data.items
             */

            if (Array.isArray(data?.items)) {

                const dollar = data.items.find(item =>
                    item?.key === 'price_dollar_rl' ||
                    item?.key === 'dollar' ||
                    item?.key === 'price_dollar'
                );

                if (dollar) {

                    const rawPrice =
                        dollar?.price?.value ??
                        dollar?.value ??
                        dollar?.price ??
                        dollar?.current;

                    const priceRial =
                        normalizeDollarToRial(rawPrice);

                    if (priceRial) {

                        const priceToman =
                            priceRial / 10;

                        return {
                            price_rial: priceRial,
                            price_toman: priceToman,

                            change:
                                parseNumber(
                                    dollar?.change?.percent ??
                                    dollar?.change ??
                                    0
                                ) || 0,

                            low:
                                normalizeDollarToRial(
                                    dollar?.low?.value ??
                                    dollar?.low ??
                                    priceRial
                                ) || priceRial,

                            high:
                                normalizeDollarToRial(
                                    dollar?.high?.value ??
                                    dollar?.high ??
                                    priceRial
                                ) || priceRial,

                            time:
                                dollar?.time ||
                                formatTime(new Date()),

                            source: 'live'
                        };
                    }
                }
            }


            /*
             * بعضی نسخه‌های API ممکن است
             * دلار را مستقیم در data قرار دهند
             */

            const possiblePrices = [
                data?.price_dollar_rl,
                data?.dollar,
                data?.dollar_price,
                data?.price,
                data?.current
            ];

            for (const rawPrice of possiblePrices) {

                const priceRial =
                    normalizeDollarToRial(rawPrice);

                if (priceRial) {

                    return {
                        price_rial: priceRial,
                        price_toman: priceRial / 10,
                        change: 0,
                        low: priceRial,
                        high: priceRial,
                        time: formatTime(new Date()),
                        source: 'live'
                    };
                }
            }

        } catch (error) {

            console.warn(
                'Dollar API failed:',
                endpoint,
                error
            );
        }
    }

    return null;
}


/* =========================
   GET DOLLAR RATE
   ========================= */

function getDollarTomanRate() {

    const rate =
        tgjuData?.dollar?.price_toman;

    if (
        Number.isFinite(rate) &&
        rate >= CONFIG.MIN_REASONABLE_DOLLAR_TOMAN &&
        rate <= CONFIG.MAX_REASONABLE_DOLLAR_TOMAN
    ) {
        return rate;
    }

    return CONFIG.DEFAULT_DOLLAR_TOMAN;
}


/* =========================
   USD -> TOMAN
   ========================= */

function tomanPrice(usdPrice) {

    const usd = parseNumber(usdPrice);

    if (!usd) {
        return 0;
    }

    return usd * getDollarTomanRate();
}


/* =========================
   CRYPTO PRICES
   ========================= */

async function fetchCryptoPrices() {

    const coins =
        'bitcoin,ethereum,tether,binancecoin,solana,ripple,cardano,dogecoin';

    const url =
        API.COINGECKO +
        '/coins/markets' +
        '?vs_currency=usd' +
        '&ids=' + coins +
        '&order=market_cap_desc' +
        '&per_page=20' +
        '&page=1' +
        '&sparkline=true' +
        '&price_change_percentage=24h';

    const response = await fetch(url, {
        method: 'GET',
        cache: 'no-store',
        signal: AbortSignal.timeout(15000)
    });

    if (!response.ok) {
        throw new Error(
            'CoinGecko HTTP ' + response.status
        );
    }

    const data = await response.json();

    cryptoData = data.map(coin => ({

        id: coin.id,

        name: coin.name,

        symbol:
            String(coin.symbol || '')
                .toUpperCase(),

        price_usd:
            Number(coin.current_price) || 0,

        price_toman:
            tomanPrice(coin.current_price),

        change:
            Number(
                coin.price_change_percentage_24h
            ) || 0,

        volume:
            Number(coin.total_volume) || 0,

        market_cap:
            Number(coin.market_cap) || 0,

        image:
            coin.image || '',

        sparkline:
            coin.sparkline_in_7d?.price || []

    }));

    return cryptoData;
}


/* =========================
   FORMAT MONEY
   ========================= */

function formatToman(value) {

    if (!Number.isFinite(value)) {
        return '۰';
    }

    return Math.round(value)
        .toLocaleString('fa-IR');
}


function formatUSD(value) {

    if (!Number.isFinite(value)) {
        return '$0';
    }

    return '$' + value.toLocaleString(
        'en-US',
        {
            maximumFractionDigits: 2
        }
    );
}


/* =========================
   CURRENCY CARDS
   ========================= */

function renderCurrencyCards() {

    const dollar =
        tgjuData?.dollar;

    const dollarPrice =
        getDollarTomanRate();

    /*
     * اگر تابع اصلی سایتت وجود دارد
     * از همان استفاده می‌کنیم
     */

    const dollarElement =
        document.querySelector('#dollar-price');

    if (dollarElement) {
        dollarElement.textContent =
            formatToman(dollarPrice);
    }


    const dollarSource =
        document.querySelector('#dollar-source');

    if (dollarSource) {

        dollarSource.textContent =
            dollar?.source === 'live'
                ? 'قیمت بازار آزاد (TGJU)'
                : 'نرخ پیش‌فرض: ۲۲۳٬۰۰۰ تومان';
    }


    const dollarLow =
        document.querySelector('#dollar-low');

    if (dollarLow) {

        dollarLow.textContent =
            formatToman(
                dollar?.low
                    ? dollar.low / 10
                    : dollarPrice
            );
    }


    const dollarHigh =
        document.querySelector('#dollar-high');

    if (dollarHigh) {

        dollarHigh.textContent =
            formatToman(
                dollar?.high
                    ? dollar.high / 10
                    : dollarPrice
            );
    }


    /*
     * اگر کارت‌ها با ID متفاوت ساخته شده باشند،
     * تابع اصلی renderCurrencyCards قبلی سایت
     * همچنان می‌تواند کار کند.
     */
}


/* =========================
   UPDATE CRYPTO TOMAN
   ========================= */

function updateCryptoTomanPrices() {

    cryptoData.forEach(coin => {

        coin.price_toman =
            tomanPrice(coin.price_usd);

    });
}


/* =========================
   TABLE
   ========================= */

function renderTable() {

    const tbody =
        document.querySelector('#crypto-table-body');

    if (!tbody) {
        return;
    }

    tbody.innerHTML = '';

    cryptoData.forEach(coin => {

        const changeClass =
            coin.change >= 0
                ? 'positive'
                : 'negative';

        const changeIcon =
            coin.change >= 0
                ? '▲'
                : '▼';

        const row =
            document.createElement('tr');

        row.innerHTML = `

            <td>
                <div class="coin-name">

                    ${
                        coin.image
                        ? `
                        <img
                            src="${coin.image}"
                            alt="${coin.name}"
                            width="32"
                            height="32"
                        >
                        `
                        : ''
                    }

                    <div>
                        <strong>
                            ${coin.name}
                        </strong>

                        <small>
                            ${coin.symbol}
                        </small>
                    </div>

                </div>
            </td>

            <td>
                ${formatUSD(coin.price_usd)}
            </td>

            <td>
                ${formatToman(coin.price_toman)}
                تومان
            </td>

            <td class="${changeClass}">
                ${changeIcon}
                ${Math.abs(coin.change).toFixed(2)}%
            </td>

            <td>
                ${formatToman(coin.volume)}
            </td>

        `;

        tbody.appendChild(row);
    });
}


/* =========================
   MAIN UPDATE
   ========================= */

async function performUpdate() {

    console.log(
        'Updating prices...',
        new Date().toLocaleTimeString()
    );

    const results =
        await Promise.allSettled([
            fetchTgjuDollar(),
            fetchCryptoPrices()
        ]);


    /*
     * دلار
     */

    if (
        results[0].status === 'fulfilled' &&
        results[0].value &&
        results[0].value.source === 'live'
    ) {

        tgjuData.dollar =
            results[0].value;

        console.log(
            'LIVE DOLLAR:',
            tgjuData.dollar.price_toman
        );

    } else {

        /*
         * اگر قیمت قبلی زنده داشتیم،
         * همان را نگه می‌داریم.
         */

        if (
            !tgjuData.dollar ||
            tgjuData.dollar.source !== 'live'
        ) {

            tgjuData.dollar =
                createFallbackDollar();

            console.warn(
                'Live dollar unavailable. Using fallback.'
            );
        }
    }


    /*
     * محاسبه دوباره قیمت تومان ارزها
     */

    updateCryptoTomanPrices();


    /*
     * رندر
     */

    try {
        renderCurrencyCards();
    } catch (error) {
        console.warn(
            'Currency card render error:',
            error
        );
    }

    try {
        renderTable();
    } catch (error) {
        console.warn(
            'Table render error:',
            error
        );
    }


    /*
     * وضعیت سایت
     */

    const status =
        document.querySelector('#update-status');

    if (status) {

        if (
            tgjuData?.dollar?.source === 'live'
        ) {

            status.textContent =
                'اطلاعات زنده';

        } else {

            status.textContent =
                'دلار پیش‌فرض';
        }
    }


    console.log(
        'Dollar:',
        getDollarTomanRate()
    );

    console.log(
        'Crypto count:',
        cryptoData.length
    );
}


/* =========================
   INITIAL LOAD
   ========================= */

document.addEventListener(
    'DOMContentLoaded',
    async () => {

        /*
         * اول سایت با قیمت پیش‌فرض باز می‌شود
         * تا صفحه خالی نباشد.
         */

        tgjuData.dollar =
            createFallbackDollar();

        try {
            renderCurrencyCards();
        } catch (e) {}


        /*
         * دریافت قیمت واقعی
         */

        await performUpdate();


        /*
         * آپدیت خودکار هر ۶۰ ثانیه
         */

        setInterval(
            performUpdate,
            CONFIG.UPDATE_INTERVAL
        );

    }
);


/* =========================
   GLOBAL DEBUG
   ========================= */

window.MrBitcoin = {

    getDollar: () =>
        getDollarTomanRate(),

    getCrypto: () =>
        cryptoData,

    update: () =>
        performUpdate()

};
</script>
