
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080b12">
  <meta name="robots" content="noindex, nofollow">
  <title>Mr. Bitcoin | در حال به‌روزرسانی</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #080b12;
      --orange: #f7931a;
      --green: #00ffa3;
      --text: #f4f6fb;
      --muted: #929bad;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 35%,
          rgba(247, 147, 26, .10), transparent 48%),
        var(--bg);
      color: var(--text);
      font-family: Tahoma, Arial, sans-serif;
    }

    .grid-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: linear-gradient(to bottom, black, transparent 90%);
    }

    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 530px;
      padding: 42px 30px;
      text-align: center;
      background: rgba(17, 22, 34, .92);
      border: 1px solid rgba(247, 147, 26, .22);
      border-radius: 25px;
      box-shadow: 0 25px 100px rgba(0, 0, 0, .42);
      animation: appear .7s ease both;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 37px;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: -.5px;
    }

    .brand-icon {
      display: grid;
      place-items: center;
      width: 43px;
      height: 43px;
      color: #111;
      background: var(--orange);
      border-radius: 14px;
      font-size: 26px;
      box-shadow: 0 0 30px rgba(247,147,26,.2);
    }

    .loader-wrap {
      position: relative;
      width: 116px;
      height: 116px;
      display: grid;
      place-items: center;
      margin: 0 auto 30px;
    }

    .loader {
      position: absolute;
      inset: 0;
      border: 3px solid rgba(255,255,255,.07);
      border-top-color: var(--orange);
      border-right-color: var(--orange);
      border-radius: 50%;
      animation: spin 1.5s linear infinite;
    }

    .loader-inner {
      position: absolute;
      inset: 10px;
      border: 2px dashed rgba(247,147,26,.23);
      border-radius: 50%;
      animation: spin 12s linear infinite reverse;
    }

    .bitcoin {
      color: var(--orange);
      font-size: 47px;
      font-weight: bold;
      animation: glow 2s ease-in-out infinite;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 14px;
      margin-bottom: 20px;
      color: var(--green);
      background: rgba(0,255,163,.06);
      border: 1px solid rgba(0,255,163,.15);
      border-radius: 30px;
      font-size: 12px;
    }

    .dot {
      width: 7px;
      height: 7px;
      background: var(--green);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--green);
      animation: blink 1.4s infinite;
    }

    h1 {
      margin-bottom: 16px;
      font-size: clamp(25px, 6vw, 34px);
      line-height: 1.7;
      font-weight: 900;
    }

    h1 span {
      color: var(--orange);
    }

    .description {
      max-width: 390px;
      margin: 0 auto;
      color: var(--muted);
      font-size: 14px;
      line-height: 2.3;
    }

    .progress {
      height: 5px;
      margin: 30px 0 13px;
      overflow: hidden;
      background: #252c3b;
      border-radius: 10px;
    }

    .progress-bar {
      width: 35%;
      height: 100%;
      background: linear-gradient(90deg, var(--orange), #ffd08a);
      border-radius: inherit;
      animation: progress 2.2s ease-in-out infinite alternate;
    }

    .progress-label {
      color: #798396;
      font-size: 11px;
    }

    .refresh {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      width: 100%;
      max-width: 240px;
      margin-top: 27px;
      padding: 14px 20px;
      color: #111;
      background: var(--orange);
      border: 0;
      border-radius: 12px;
      font-family: inherit;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: .2s;
    }

    .refresh:hover {
      background: #ffad42;
      transform: translateY(-2px);
    }

    .footer {
      margin-top: 32px;
      padding-top: 20px;
      border-top: 1px solid rgba(255,255,255,.07);
      color: #6f788a;
      font-size: 11px;
      line-height: 2;
    }

    .footer strong {
      color: #aeb6c6;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes blink {
      50% { opacity: .35; }
    }

    @keyframes glow {
      50% { text-shadow: 0 0 25px rgba(247,147,26,.55); }
    }

    @keyframes progress {
      from { transform: translateX(-30%); }
      to { transform: translateX(180%); }
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 420px) {
      .card { padding: 32px 20px; }
      .brand { margin-bottom: 30px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>

<body>
  <div class="grid-bg"></div>

  <main class="card">
    <div class="brand">
      <div class="brand-icon">₿</div>
      <span>MR. BITCOIN</span>
    </div>

    <div class="loader-wrap">
      <div class="loader"></div>
      <div class="loader-inner"></div>
      <div class="bitcoin">₿</div>
    </div>

    <div class="status">
      <span class="dot"></span>
      سیستم در حال به‌روزرسانی
    </div>

    <h1>
      داریم چیزهای <span>خفنی</span><br>
      آماده می‌کنیم!
    </h1>

    <p class="description">
      داشبورد Mr. Bitcoin موقتاً در دسترس نیست.
      در حال به‌روزرسانی و بهبود سیستم هستیم.
      به‌زودی برمی‌گردیم!
    </p>

    <div class="progress">
      <div class="progress-bar"></div>
    </div>

    <div class="progress-label">
      عملیات به‌روزرسانی در حال انجام است
    </div>

    <button class="refresh" onclick="location.reload()">
      <span>↻</span>
      بررسی مجدد سایت
    </button>

    <div class="footer">
      <strong>Mr. Bitcoin</strong>
      <br>
      ساخته‌شده توسط مهرسام امجدیان
      <br>
      © 2026 — تمام حقوق محفوظ است
    </div>
  </main>
</body>
</html>
